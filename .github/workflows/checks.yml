# The checks of this repo: the steps of Azir's azir-ci-reusable.yml, inlined because this repo is
# public and alipowadev/azir is private (a public repo can't call a private repo's workflow).
# The QA agent reads the artifacts: junit (junit.xml) and logs (one file per step).
# The required status check is "ci / checks" (caller job `ci` in ci.yml, this job `checks`).
name: checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash # explicit bash runs with -eo pipefail, so `cmd | tee` keeps cmd's failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: install
        run: |
          mkdir -p ci-logs
          uv sync --frozen 2>&1 | tee ci-logs/install.log
      - name: unit tests
        run: uv run pytest 2>&1 | tee ci-logs/test.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit
          path: junit.xml
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs
          path: ci-logs/
          if-no-files-found: ignore
