[project]
name = "scratch"
version = "0.1.0"
description = "Scratch product repo for testing Azir's dev and review workflows (P14, P15)."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scratch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--junitxml=junit.xml"
